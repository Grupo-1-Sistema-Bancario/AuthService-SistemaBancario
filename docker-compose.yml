version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: authserviceSistemaBancario_postgres
    restart: always
    environment:
      POSTGRES_DB: DBSistemaBancario
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_01:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5023:5023"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5023
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
    depends_on:
      - postgres

volumes:
  postgres_data_01:
